version: "3.9"

# AI-Augmented Code Review System — local development / evaluation stack.
# Brings up Postgres, SonarQube Community Edition, and the .NET backend
# exactly as described in Table 1 (Technology) and Table 2 (Resources) of
# the proposal. Run `docker compose up -d` from the repository root.

services:
  postgres:
    image: postgres:16
    container_name: codereview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codereview
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codereview_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: codereview-sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/codereview
      SONAR_JDBC_USERNAME: codereview
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-codereview_dev_password}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/src/CodeReview.Api/Dockerfile
    container_name: codereview-api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=codereview;Username=codereview;Password=${POSTGRES_PASSWORD:-codereview_dev_password}"
      GitHub__AccessToken: ${GITHUB_ACCESS_TOKEN}
      GitHub__WebhookSecret: ${GITHUB_WEBHOOK_SECRET}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o}
      SonarQube__BaseUrl: http://sonarqube:9000
      SonarQube__ApiToken: ${SONARQUBE_API_TOKEN}
      SonarQube__ProjectKey: ${SONARQUBE_PROJECT_KEY:-ai-augmented-code-review}
      Cors__AllowedOrigins__0: http://localhost:5173
      Demo__SeedOnStartup: ${DEMO_SEED_ON_STARTUP:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
